<text x="40" y="726" fill="#555" font-size="11">Shaded: the four responders who nearly stopped receiving pings after 4.2. Their rates rest on only 11–17 pings each since 12 Aug. Their before-4.2 rate was 1–4% (1–3 missed of 70–86 pings).</text>
<text x="40" y="742" fill="#555" font-size="11">Missed depends on the ping wait, cut from 90s to 60s in 4.2, so before/after is not strictly like-for-like. Source: rook.pings.</text>
